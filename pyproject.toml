[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "itch-book"
version = "0.1.0a0"
description = "NASDAQ TotalView-ITCH 5.0 to research tables: BBO, trades, order book. C++23 core, zero-copy numpy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "groovg" }]
keywords = ["nasdaq", "itch", "totalview", "order-book", "market-data", "microstructure", "parquet"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "tzdata"]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pyarrow = ["pyarrow>=15"]

[project.urls]
Homepage = "https://github.com/groovg/itch-book"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "python"
build-dir = "build/py/{wheel_tag}"
wheel.packages = ["python/itch_book"]
wheel.py-api = "cp312"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
